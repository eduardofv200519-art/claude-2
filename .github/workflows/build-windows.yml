name: Build Windows installer

on:
  push:
    branches: ["**"]
    paths:
      - "music-downloader/**"
      - ".github/workflows/build-windows.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: music-downloader
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1 | Copy-Item -Destination ffmpeg\ffmpeg.exe
          Get-ChildItem ffmpeg_tmp -Recurse -Filter ffprobe.exe | Select-Object -First 1 | Copy-Item -Destination ffmpeg\ffprobe.exe

      - name: Download Deno (needed by yt-dlp for YouTube)
        shell: pwsh
        run: |
          $v = (Invoke-RestMethod https://dl.deno.land/release-latest.txt).Trim()
          Invoke-WebRequest "https://dl.deno.land/release/$v/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath deno
          deno\deno.exe --version

      - name: Build exe with PyInstaller
        run: >
          pyinstaller app.py --noconfirm --windowed
          --name DescargadorMusica
          --icon icon.ico
          --add-data "icon.ico;."
          --add-data "icon.png;."
          --collect-all sv_ttk
          --collect-all spotdl
          --collect-all ytmusicapi
          --collect-all yt_dlp
          --collect-all pykakasi
          --collect-all syncedlyrics
          --copy-metadata spotdl

      - name: Bundle FFmpeg and smoke test
        shell: pwsh
        run: |
          Copy-Item -Recurse ffmpeg dist\DescargadorMusica\ffmpeg
          Copy-Item -Recurse deno dist\DescargadorMusica\deno
          $p = Start-Process dist\DescargadorMusica\DescargadorMusica.exe -ArgumentList "--spotdl-cli","--version" -RedirectStandardOutput version.txt -Wait -PassThru -NoNewWindow
          Get-Content version.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Test GUI starts
        shell: pwsh
        run: |
          $p = Start-Process dist\DescargadorMusica\DescargadorMusica.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "La ventana se cerró con código $($p.ExitCode)"; exit 1 }
          Write-Host "GUI en ejecución (PID $($p.Id))"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\gui-windows.png")
          Stop-Process -Id $p.Id -Force

      - name: Test real download (one track)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force test_out | Out-Null
          $env:PATH = "$PWD\dist\DescargadorMusica\deno;$env:PATH"
          $out = "$PWD\test_out\{artists} - {title}.{output-ext}"
          $exe = "dist\DescargadorMusica\DescargadorMusica.exe"
          $ff = "$PWD\dist\DescargadorMusica\ffmpeg\ffmpeg.exe"
          $p = Start-Process $exe -ArgumentList "--spotdl-cli","download","`"https://open.spotify.com/track/4cOdK2wGLETKBW3PvgPWqT`"","--output","`"$out`"","--format","mp3","--ffmpeg","`"$ff`"","--simple-tui","--log-level","DEBUG" -RedirectStandardOutput dl.txt -RedirectStandardError dl_err.txt -Wait -PassThru -NoNewWindow
          Get-Content dl.txt -Tail 80
          Get-Content dl_err.txt -Tail 40
          $files = Get-ChildItem test_out -Filter *.mp3
          $files | Format-Table Name, Length
          Remove-Item -Recurse -Force test_out
          if ($files) {
            "### ✅ Descarga real: OK ($($files[0].Length) bytes)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            $why = if (Select-String -Path dl.txt -Pattern "not a bot" -Quiet) { "YouTube bloqueó la IP del servidor de GitHub (\"not a bot\"). Es normal en la nube; en un PC de casa no suele pasar." } else { "Revisa el registro de este paso." }
            "### ⚠️ Descarga real: falló`n$why" >> $env:GITHUB_STEP_SUMMARY
            Write-Error "No se descargó ningún archivo"; exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: gui-screenshot
          path: music-downloader/gui-windows.png

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          Compress-Archive -Path dist\DescargadorMusica\* -DestinationPath Output\DescargadorMusica-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DescargadorMusica-Windows
          path: |
            music-downloader/Output/DescargadorMusica-Setup.exe
            music-downloader/Output/DescargadorMusica-portable.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Descargador de Musica ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: |
            music-downloader/Output/DescargadorMusica-Setup.exe
            music-downloader/Output/DescargadorMusica-portable.zip
