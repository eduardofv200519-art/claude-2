name: Build Windows installer

on:
  push:
    branches: ["**"]
    paths:
      - "music-downloader/**"
      - ".github/workflows/build-windows.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: music-downloader
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1 | Copy-Item -Destination ffmpeg\ffmpeg.exe

      - name: Download Deno (needed by yt-dlp for YouTube)
        shell: pwsh
        run: |
          $v = (Invoke-RestMethod https://dl.deno.land/release-latest.txt).Trim()
          Invoke-WebRequest "https://dl.deno.land/release/$v/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath deno
          deno\deno.exe --version

      - name: Build exe with PyInstaller
        run: >
          pyinstaller app.py --noconfirm --windowed
          --name Deanp3
          --icon icon.ico
          --add-data "icon.ico;."
          --add-data "icon.png;."
          --collect-all sv_ttk
          --collect-all spotdl
          --collect-all ytmusicapi
          --collect-all yt_dlp
          --collect-all pykakasi
          --collect-all syncedlyrics
          --copy-metadata spotdl

      - name: Bundle FFmpeg and smoke test
        shell: pwsh
        run: |
          Copy-Item -Recurse ffmpeg dist\Deanp3\ffmpeg
          Copy-Item -Recurse deno dist\Deanp3\deno
          $p = Start-Process dist\Deanp3\Deanp3.exe -ArgumentList "--spotdl-cli","--version" -RedirectStandardOutput version.txt -Wait -PassThru -NoNewWindow
          Get-Content version.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Test GUI (real download from the window)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\$name.png")
            $jpg = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object MimeType -eq "image/jpeg"
            $ep = New-Object System.Drawing.Imaging.EncoderParameters 1
            $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 60L
            $bmp.Save("$PWD\$name.jpg", $jpg, $ep)
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\$name.jpg"))
            Write-Host "SHOT_BEGIN $name"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { Write-Host ("B64 ${name}:" + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))) }
            Write-Host "SHOT_END $name"
          }
          $env:DEANP3_AUTOTEST = "https://open.spotify.com/track/4cOdK2wGLETKBW3PvgPWqT"
          $p = Start-Process dist\Deanp3\Deanp3.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "La ventana se cerró con código $($p.ExitCode)"; exit 1 }
          Shot "gui-1-inicio"
          Start-Sleep -Seconds 20
          Shot "gui-2-descargando"
          Start-Sleep -Seconds 45
          Shot "gui-3-final"
          if ($p.HasExited) { Write-Error "La app se cerró sola"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Get-ChildItem "$env:USERPROFILE\Music" -Recurse -Include *.mp3 | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: music-downloader/gui-*.png

      - name: Test real download (one track)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force test_out | Out-Null
          $env:PATH = "$PWD\dist\Deanp3\deno;$env:PATH"
          $out = "$PWD\test_out\{artists} - {title}.{output-ext}"
          $exe = "dist\Deanp3\Deanp3.exe"
          $ff = "$PWD\dist\Deanp3\ffmpeg\ffmpeg.exe"
          $p = Start-Process $exe -ArgumentList "--spotdl-cli","download","`"https://open.spotify.com/track/4cOdK2wGLETKBW3PvgPWqT`"","--output","`"$out`"","--format","mp3","--ffmpeg","`"$ff`"","--simple-tui","--log-level","DEBUG" -RedirectStandardOutput dl.txt -RedirectStandardError dl_err.txt -Wait -PassThru -NoNewWindow
          Get-Content dl.txt -Tail 80
          Get-Content dl_err.txt -Tail 40
          $events = @(Select-String -Path dl.txt -Pattern '@@EVT').Count
          "Eventos de progreso recibidos: $events" >> $env:GITHUB_STEP_SUMMARY
          $files = Get-ChildItem test_out -Filter *.mp3
          $files | Format-Table Name, Length
          Remove-Item -Recurse -Force test_out
          if ($files) {
            "### ✅ Descarga real: OK ($($files[0].Length) bytes)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            $why = if (Select-String -Path dl.txt -Pattern "not a bot" -Quiet) { 'YouTube bloqueó la IP del servidor de GitHub ("not a bot"). Es normal en la nube; en un PC de casa no suele pasar.' } else { 'Revisa el registro de este paso.' }
            "### ⚠️ Descarga real: falló`n$why" >> $env:GITHUB_STEP_SUMMARY
            Write-Error "No se descargó ningún archivo"; exit 1
          }

      - name: Test fallback download (SoundCloud / Bandcamp)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force test_fb | Out-Null
          $env:PATH = "$PWD\dist\Deanp3\deno;$env:PATH"
          $out = "$PWD\test_fb\{artists} - {title}.{output-ext}"
          $ff = "$PWD\dist\Deanp3\ffmpeg\ffmpeg.exe"
          $p = Start-Process dist\Deanp3\Deanp3.exe -ArgumentList "--spotdl-cli","download","`"https://open.spotify.com/track/4cOdK2wGLETKBW3PvgPWqT`"","--output","`"$out`"","--format","mp3","--ffmpeg","`"$ff`"","--simple-tui","--log-level","DEBUG","--audio","soundcloud","bandcamp" -RedirectStandardOutput fb.txt -RedirectStandardError fb_err.txt -Wait -PassThru -NoNewWindow
          Select-String -Path fb.txt, fb_err.txt -Pattern "soundcloud|bandcamp|Error|Downloaded|No results|failed to find|Skipping" | Select-Object -Last 40 | ForEach-Object { "FB: " + $_.Line }
          $files = Get-ChildItem test_fb -Filter *.mp3
          $files | ForEach-Object { "FB_FILE: $($_.Name) $($_.Length)" }
          if (-not $files) { exit 1 }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          Compress-Archive -Path dist\Deanp3\* -DestinationPath Output\Deanp3-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Deanp3-Windows
          path: |
            music-downloader/Output/Deanp3-Setup.exe
            music-downloader/Output/Deanp3-portable.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Deanp3 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: |
            music-downloader/Output/Deanp3-Setup.exe
            music-downloader/Output/Deanp3-portable.zip
